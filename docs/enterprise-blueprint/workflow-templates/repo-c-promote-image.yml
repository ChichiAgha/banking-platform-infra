name: promote-image

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment (dev or prod)'
        required: true
        default: dev
      imageTag:
        description: 'Immutable image tag (git SHA)'
        required: true

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Helm values
        run: |
          ENV=${{ github.event.inputs.environment }}
          TAG=${{ github.event.inputs.imageTag }}
          VALUES=env/${ENV}/values.yaml
          sed -i "s/tag: .*/tag: ${TAG}/g" ${VALUES}
      - name: Commit change
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add env/
          git commit -m "promote(${{ github.event.inputs.environment }}): ${{ github.event.inputs.imageTag }}" || echo "No changes"
          git push
