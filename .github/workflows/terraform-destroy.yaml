name: terraform-destroy

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DESTROY-DEV to plan destruction of the development stack
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: terraform-apply-development
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  AWS_REGION: ${{ vars.AWS_REGION }}
  STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  STATE_KMS_KEY_ARN: ${{ vars.TF_STATE_KMS_KEY_ARN }}

jobs:
  plan-destroy:
    if: github.event.inputs.confirmation == 'DESTROY-DEV'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.13.3"
      - name: Configure read-only AWS plan credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.TF_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: terraform-destroy-plan-${{ github.run_id }}
      - name: Verify explicit destroy confirmation
        run: test "${{ github.event.inputs.confirmation }}" = "DESTROY-DEV"
      - name: Initialize encrypted remote state
        working-directory: terraform
        run: |
          terraform init -reconfigure \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="key=banking/dev/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="kms_key_id=${STATE_KMS_KEY_ARN}" \
            -backend-config="use_lockfile=true"
      - name: Create destruction plan
        working-directory: terraform
        run: |
          terraform plan -destroy -lock-timeout=5m -var-file=envs/dev.tfvars -out=destroy.tfplan
          terraform show -no-color destroy.tfplan > destroy-plan.txt
      - name: Publish destruction plan for approval review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: terraform-development-destroy-${{ github.run_id }}
          path: |
            terraform/destroy.tfplan
            terraform/destroy-plan.txt
          retention-days: 1

  destroy-development:
    needs: plan-destroy
    runs-on: ubuntu-latest
    environment: development
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.13.3"
      - name: Configure AWS destroy credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.TF_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: terraform-destroy-${{ github.run_id }}
      - name: Initialize encrypted remote state
        working-directory: terraform
        run: |
          terraform init -reconfigure \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="key=banking/dev/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="kms_key_id=${STATE_KMS_KEY_ARN}" \
            -backend-config="use_lockfile=true"
      - name: Download reviewed destruction plan
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: terraform-development-destroy-${{ github.run_id }}
          path: terraform/destroy-artifact
      - name: Destroy development infrastructure
        working-directory: terraform
        run: terraform apply -lock-timeout=5m -auto-approve destroy-artifact/destroy.tfplan
