name: terraform-drift

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-drift-development
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  AWS_REGION: ${{ vars.AWS_REGION }}
  STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  STATE_KMS_KEY_ARN: ${{ vars.TF_STATE_KMS_KEY_ARN }}

jobs:
  detect-development-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.13.3"
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.TF_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: terraform-drift-${{ github.run_id }}
      - name: Initialize encrypted remote state
        working-directory: terraform
        run: |
          terraform init -reconfigure \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="key=banking/dev/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="kms_key_id=${STATE_KMS_KEY_ARN}" \
            -backend-config="use_lockfile=true"
      - name: Detect drift
        working-directory: terraform
        run: |
          set +e
          terraform plan -detailed-exitcode -lock=false -refresh-only -var-file=envs/dev.tfvars -no-color > drift.txt
          code=$?
          cat drift.txt >> "${GITHUB_STEP_SUMMARY}"
          if [ "$code" -eq 1 ]; then exit 1; fi
          if [ "$code" -eq 2 ]; then echo "Infrastructure drift detected"; exit 2; fi