name: terraform-ci

on:
  pull_request:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-*.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  AWS_REGION: ${{ vars.AWS_REGION }}
  STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  STATE_KMS_KEY_ARN: ${{ vars.TF_STATE_KMS_KEY_ARN }}

jobs:
  secret-scan:
    name: Shift-left secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Detect committed secrets
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  validate-and-scan:
    needs: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.13.3"
      - uses: terraform-linters/setup-tflint@c750028ac0f3831886a261f96da68ab58a92e7ec # v6
        with:
          tflint_version: v0.59.1
      - name: Check formatting
        run: terraform fmt -check -recursive terraform
      - name: Initialize without backend
        working-directory: terraform
        run: terraform init -backend=false
      - name: Validate
        working-directory: terraform
        run: terraform validate
      - name: Lint
        working-directory: terraform
        run: |
          tflint --init
          tflint --recursive
      - name: Enforce Checkov Terraform policy
        uses: bridgecrewio/checkov-action@59b9d7edfcad5b87fbe3f473a9a134a721ad03f8 # v12
        with:
          directory: terraform
          framework: terraform
          baseline: terraform/.checkov.baseline
          quiet: true
          soft_fail: false

  plan-development:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    needs: validate-and-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.13.3"
      - name: Configure read-only AWS plan credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.TF_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: terraform-plan-${{ github.run_id }}
      - name: Initialize encrypted remote state
        working-directory: terraform
        run: |
          terraform init -reconfigure \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="key=banking/dev/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="kms_key_id=${STATE_KMS_KEY_ARN}" \
            -backend-config="use_lockfile=true"
      - name: Plan development infrastructure
        working-directory: terraform
        run: |
          terraform plan -lock-timeout=5m -var-file=envs/dev.tfvars -out=tfplan
          terraform show -no-color tfplan > tfplan.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: terraform-development-plan-${{ github.sha }}
          path: terraform/tfplan.txt
          retention-days: 14
